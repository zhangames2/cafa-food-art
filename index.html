<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>央美食物艺术 | CAFA Food Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4AF37;
            --gold-light: #F4D03F;
            --gold-dark: #B8860B;
            --black: #0A0A0A;
            --black-light: #1A1A1A;
            --black-lighter: #2A2A2A;
            --white: #F5F5F5;
            --gray: #888888;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 导航栏 */
        nav {
            background: linear-gradient(180deg, var(--black) 0%, var(--black-light) 100%);
            border-bottom: 1px solid var(--gold-dark);
            padding: 1rem 2rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: var(--gold);
            background: var(--black);
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--gold);
        }

        .logo-text span {
            display: block;
            font-size: 0.65rem;
            color: var(--gray);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* 主内容区 */
        main {
            padding-top: 100px;
            min-height: 100vh;
        }

        /* Hero 区域 */
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, var(--black) 0%, var(--black-light) 50%, var(--black) 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 8px;
            color: var(--gold);
            margin-bottom: 1rem;
            position: relative;
        }

        .hero h1::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 1.5rem auto;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* 上传区域 */
        .upload-section {
            padding: 4rem 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .upload-container {
            border: 2px dashed var(--gold-dark);
            border-radius: 8px;
            padding: 4rem 2rem;
            text-align: center;
            background: var(--black-light);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .upload-container:hover,
        .upload-container.dragover {
            border-color: var(--gold);
            background: var(--black-lighter);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--gold);
        }

        .upload-text {
            font-size: 1.2rem;
            color: var(--white);
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            font-size: 0.85rem;
            color: var(--gray);
        }

        input[type="file"] {
            display: none;
        }

        /* 图片预览区 */
        .preview-section {
            display: none;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .preview-section.active {
            display: block;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .preview-container {
                grid-template-columns: 1fr;
            }
        }

        .image-box {
            background: var(--black-light);
            border: 1px solid var(--gold-dark);
            border-radius: 8px;
            overflow: hidden;
        }

        .image-box-header {
            background: linear-gradient(90deg, var(--black-lighter), var(--black-light));
            padding: 1rem;
            border-bottom: 1px solid var(--gold-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .image-box-header .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
        }

        .image-box-header span {
            font-size: 0.85rem;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .image-box-content {
            padding: 1rem;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-box-content img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 4px;
        }

        /* 转换按钮 */
        .convert-btn {
            display: block;
            width: 200px;
            margin: 0 auto 3rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            border: none;
            border-radius: 4px;
            color: var(--black);
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        .convert-btn:disabled {
            background: var(--gray);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .convert-btn.loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% { left: 100%; }
        }

        /* 结果区域 */
        .result-section {
            display: none;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .result-section.active {
            display: block;
        }

        .result-card {
            background: linear-gradient(135deg, var(--black-light), var(--black-lighter));
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
        }

        .result-food-image {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 2rem;
            display: block;
            border-radius: 8px;
            border: 2px solid var(--gold-dark);
        }

        .result-title {
            text-align: center;
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        .result-story {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--white);
            text-align: justify;
            padding: 1.5rem;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            border-left: 3px solid var(--gold);
        }

        .food-tag {
            display: inline-block;
            padding: 0.3rem 1rem;
            background: var(--gold-dark);
            color: var(--black);
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 0.5rem 0.5rem 0 0;
            font-weight: 500;
        }

        /* 页脚 */
        footer {
            background: var(--black-light);
            border-top: 1px solid var(--gold-dark);
            padding: 2rem;
            text-align: center;
        }

        .footer-logo {
            font-size: 1.2rem;
            color: var(--gold);
            letter-spacing: 3px;
            margin-bottom: 1rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--gray);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--gold);
        }

        .copyright {
            font-size: 0.8rem;
            color: var(--gray);
        }

        /* 装饰元素 */
        .decoration-line {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
            margin: 2rem 0;
        }

        /* 加载动画 */
        .loader {
            display: none;
            width: 50px;
            height: 50px;
            border: 3px solid var(--gold-dark);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        .loader.active {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 重置按钮 */
        .reset-btn {
            display: block;
            width: 150px;
            margin: 2rem auto 0;
            padding: 0.8rem 1.5rem;
            background: transparent;
            border: 1px solid var(--gold);
            border-radius: 4px;
            color: var(--gold);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: var(--gold);
            color: var(--black);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-container">
            <div class="logo">
                <div class="logo-icon">央美</div>
                <div class="logo-text">
                    中央美术学院
                    <span>Central Academy of Fine Arts</span>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="https://www.cafa.edu.cn" target="_blank">学院官网</a></li>
                <li><a href="#">食物艺术</a></li>
                <li><a href="#">关于项目</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主内容 -->
    <main>
        <!-- Hero 区域 -->
        <section class="hero">
            <h1>食物艺术</h1>
            <p>将影像转化为味蕾的诗意，用艺术的眼光重新诠释世界。上传图片，让AI为您编织一段美食与故事的奇妙旅程。</p>
        </section>

        <!-- 上传区域 -->
        <section class="upload-section" id="uploadSection">
            <div class="upload-container" id="dropZone">
                <div class="upload-icon">+</div>
                <div class="upload-text">拖拽图片至此或点击上传</div>
                <div class="upload-hint">支持 JPG、PNG 格式，建议尺寸不超过 5MB</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
        </section>

        <!-- 预览区域 -->
        <section class="preview-section" id="previewSection">
            <div class="preview-container">
                <div class="image-box">
                    <div class="image-box-header">
                        <div class="dot"></div>
                        <span>原始影像</span>
                    </div>
                    <div class="image-box-content">
                        <img id="originalImage" src="" alt="原始图片">
                    </div>
                </div>
                <div class="image-box" id="resultBox" style="display: none;">
                    <div class="image-box-header">
                        <div class="dot"></div>
                        <span>食物艺术转化</span>
                    </div>
                    <div class="image-box-content">
                        <img id="foodImage" src="" alt="食物艺术">
                    </div>
                </div>
            </div>
            <button class="convert-btn" id="convertBtn">开始转化</button>
            <div class="loader" id="loader"></div>
        </section>

        <!-- 结果区域 -->
        <section class="result-section" id="resultSection">
            <div class="result-card">
                <img class="result-food-image" id="resultFoodImage" src="" alt="">
                <h3 class="result-title" id="foodName"></h3>
                <div id="foodTags"></div>
                <div class="decoration-line"></div>
                <p class="result-story" id="foodStory"></p>
                <button class="reset-btn" id="resetBtn">再次创作</button>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer>
        <div class="footer-logo">中央美术学院</div>
        <div class="footer-links">
            <a href="https://www.cafa.edu.cn" target="_blank">学院官网</a>
            <a href="#">艺术展览</a>
            <a href="#">学术研究</a>
            <a href="#">联系我们</a>
        </div>
        <div class="copyright">© 2026 中央美术学院 Central Academy of Fine Arts. All Rights Reserved.</div>
    </footer>

    <script>
        // 食物艺术数据库
        const foodArtDatabase = {
            themes: ['埃塞俄比亚咖啡', '非洲香料炖菜', '传统英吉拉', '蜂蜜酒', '坚果拼盘', '热带水果塔'],
            stories: [
                '这碗浓郁的埃塞俄比亚咖啡，承载着高原的阳光与晨露。每一口都是大地对勤劳者的馈赠，苦涩中回甘，正如人生历经风雨后的甘甜。分享一杯咖啡，便是分享和平与友谊的希望。',
                '色彩斑斓的蔬菜炖菜，如同非洲大地上的生命之歌。胡萝卜的橙、菠菜的绿、番茄的红，在锅中交融成和谐的画面。这道菜提醒我们：多样性让世界更美好，团结创造无限可能。',
                '薄如蝉翼的英吉拉饼，是埃塞俄比亚人智慧的结晶。发酵的酸甜滋味，象征着时间的魔法。生活亦如此，耐心等待，平凡终将酿成非凡。',
                '金色的蜂蜜酒在杯中闪耀，如同非洲草原上最美的日落。这甘甜的饮品，是庆祝和平与丰收的佳酿。愿每一滴甜蜜，都化作对美好明天的期许。',
                '精心搭配的坚果拼盘，每一颗都是大自然的珍宝。腰果的圆润、杏仁的修长、核桃的纹理，共同构成一幅静物画。它们教会我们：真正的富足，源于对简单事物的珍惜。',
                '热带水果塔上，芒果的金黄、百香果的芬芳、椰子的清甜层层叠加。这不仅是味觉的盛宴，更是生命的礼赞——即使来自不同的土壤，也能在同一个盘子里绽放和谐之美。'
            ],
            colors: ['#8B4513', '#D2691E', '#CD853F', '#DEB887', '#F4A460', '#DAA520']
        };

        // DOM 元素
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.getElementById('uploadSection');
        const previewSection = document.getElementById('previewSection');
        const resultSection = document.getElementById('resultSection');
        const originalImage = document.getElementById('originalImage');
        const convertBtn = document.getElementById('convertBtn');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');
        const foodImage = document.getElementById('foodImage');
        const resultFoodImage = document.getElementById('resultFoodImage');
        const foodName = document.getElementById('foodName');
        const foodStory = document.getElementById('foodStory');
        const foodTags = document.getElementById('foodTags');
        const resetBtn = document.getElementById('resetBtn');

        let currentFile = null;

        // 事件监听
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        convertBtn.addEventListener('click', startConversion);
        resetBtn.addEventListener('click', resetAll);

        // 处理文件
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请上传图片文件');
                return;
            }

            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImage.src = e.target.result;
                uploadSection.style.display = 'none';
                previewSection.classList.add('active');
            };
            reader.readAsDataURL(file);
        }

        // 生成食物艺术图片（使用 Canvas 绘制）
        function generateFoodArt() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 400;

            // 随机选择主题色
            const themeColor = foodArtDatabase.colors[Math.floor(Math.random() * foodArtDatabase.colors.length)];
            
            // 绘制背景
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#1a1a1a');
            gradient.addColorStop(0.5, themeColor + '40');
            gradient.addColorStop(1, '#0a0a0a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制装饰圆环
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 2;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(300, 200, 100 + i * 30, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 绘制中心食物图案（抽象圆形表示盘子）
            ctx.beginPath();
            ctx.arc(300, 200, 80, 0, Math.PI * 2);
            ctx.fillStyle = themeColor;
            ctx.fill();
            ctx.strokeStyle = '#D4AF37';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 绘制食物纹理
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const x = 300 + Math.cos(angle) * 50;
                const y = 200 + Math.sin(angle) * 50;
                ctx.beginPath();
                ctx.arc(x, y, 15, 0, Math.PI * 2);
                ctx.fillStyle = i % 2 === 0 ? '#D4AF37' : '#F4D03F';
                ctx.fill();
            }

            // 中心点缀
            ctx.beginPath();
            ctx.arc(300, 200, 20, 0, Math.PI * 2);
            ctx.fillStyle = '#8B4513';
            ctx.fill();

            // 添加文字
            ctx.font = '300 16px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillStyle = '#D4AF37';
            ctx.textAlign = 'center';
            ctx.fillText('CAFA FOOD ART', 300, 350);

            return canvas.toDataURL('image/png');
        }

        // 开始转化
        function startConversion() {
            convertBtn.disabled = true;
            convertBtn.classList.add('loading');
            convertBtn.textContent = '转化中...';
            loader.classList.add('active');

            // 模拟 AI 处理时间
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * foodArtDatabase.themes.length);
                const foodArtImage = generateFoodArt();
                
                // 显示结果
                foodImage.src = foodArtImage;
                resultFoodImage.src = foodArtImage;
                foodName.textContent = foodArtDatabase.themes[randomIndex];
                foodStory.textContent = foodArtDatabase.stories[randomIndex];
                
                // 生成标签
                const tags = ['艺术转化', 'AI创作', '食物美学', '正能量'];
                foodTags.innerHTML = tags.map(tag => `<span class="food-tag">${tag}</span>`).join('');

                resultBox.style.display = 'block';
                loader.classList.remove('active');
                convertBtn.classList.remove('loading');
                convertBtn.textContent = '转化完成';

                // 滚动到结果区域
                setTimeout(() => {
                    resultSection.classList.add('active');
                    resultSection.scrollIntoView({ behavior: 'smooth' });
                }, 500);
            }, 2000);
        }

        // 重置
        function resetAll() {
            currentFile = null;
            fileInput.value = '';
            originalImage.src = '';
            foodImage.src = '';
            resultFoodImage.src = '';
            foodName.textContent = '';
            foodStory.textContent = '';
            foodTags.innerHTML = '';
            
            uploadSection.style.display = 'block';
            previewSection.classList.remove('active');
            resultSection.classList.remove('active');
            resultBox.style.display = 'none';
            
            convertBtn.disabled = false;
            convertBtn.textContent = '开始转化';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 自动加载测试图片
        window.addEventListener('load', () => {
            fetch('/root/openclaw/kimi/downloads/19c9526e-4272-8a32-8000-00008cf5caf7_屏幕截图_2026-02-24_183112.png')
                .then(response => response.blob())
                .then(blob => {
                    const file = new File([blob], 'test-image.png', { type: 'image/png' });
                    handleFile(file);
                })
                .catch(err => {
                    console.log('测试图片加载失败，请手动上传');
                });
        });
    </script>
</body>
</html>
